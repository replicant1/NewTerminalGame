[pytest]
# The single suite command is `.venv/bin/python -m pytest -q` from the
# repository root (IMPLEMENTATION_PLAN.md section 1.2).  Everything here exists
# so that that one command works with nothing else set up.

minversion = 8.0
testpaths = tests

# Put the repository root on sys.path so `import terminal_game` and
# `import tools.layer_rule` work without installing anything.  There is no
# packaging step on this project and there is not going to be one.
pythonpath = .

# `-m "not needs_window"` is the default exclusion required by section 1.6:
# the default suite must never put a window on the user's screen.  A command
# line `-m ...` overrides this, which is how S-1 or a human-verification run
# asks for the excluded tests deliberately.
addopts = --strict-markers -m "not needs_window"

markers =
    needs_window: puts a real window on the user's screen; excluded from the default suite (IMPLEMENTATION_PLAN.md section 1.6). Anything marked this way is subject to the window hygiene of section 1.5 without exception - capture the window id at creation, let the process exit, confirm it, then close.
